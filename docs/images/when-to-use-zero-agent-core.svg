  <text x="500" y="185" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#15803d">LangChain / LangGraph</text>
  <text x="500" y="210" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif" fill="#166534">连接器和示例更多</text>

  <rect x="670" y="120" width="260" height="110" rx="16" fill="#fef9c3" stroke="#eab308"/>
