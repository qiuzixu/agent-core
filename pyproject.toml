[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "handwritten-agent-core"
version = "0.1.0"
description = "零外部平台绑定的 Python Agent 运行时内核"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
keywords = ["agent", "llm", "react", "mcp", "acp", "function-calling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/qiuzixu/agent-core"
Documentation = "https://github.com/qiuzixu/agent-core/tree/main/docs"
Repository = "https://github.com/qiuzixu/agent-core"
Issues = "https://github.com/qiuzixu/agent-core/issues"

[dependency-groups]
dev = [
  "mkdocs-material>=9.7,<10",
]

[project.optional-dependencies]
dev = [
  "mkdocs-material>=9.7,<10",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

production = [
  "asyncpg>=0.30,<1",
]

mcp = [
  "mcp>=1.27,<2",
]

openai = [
  "openai>=1.0,<2",
  "httpx>=0.28,<1",
]

anthropic = [
  "anthropic>=0.40,<1",
]

gemini = [
  "google-genai>=1.0,<2",
]

qwen = [
  "dashscope>=1.27,<2",
]

models = [
  "openai>=1.0,<2",
  "httpx>=0.28,<1",
  "anthropic>=0.40,<1",
  "google-genai>=1.0,<2",
  "dashscope>=1.27,<2",
]

[project.scripts]
docs = "agent_core.docs:main"
dev-docs = "agent_core.docs:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
