  <text x="70" y="595" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#334155">成熟框架往往更快：生态、连接器、示例和长期社区维护都更完整。</text>
  <text x="70" y="625" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#475569">zero-agent-core 不是替代品，只是面向嵌入式运行时边界的轻量选项。</text>
