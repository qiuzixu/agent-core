name: Core CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: ruff check src tests examples
      - name: Test
        run: pytest
      - name: Build package
        run: python -m build
