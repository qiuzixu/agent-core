name: Docs

on:
  # 日常 push 不再自动构建文档（避免无关提交触发失败邮件）；
  # 文档变更在 PR 时检查，正式部署用 tag 触发的发布工作流。
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]" mkdocs-material
      - name: Build docs
        run: python -m mkdocs build
      - uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site
