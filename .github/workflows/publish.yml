name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tool
        run: python -m pip install build twine
      - name: Build four distributions
        run: |
          python -m build
          python -m build packages/mineru
          python -m build packages/embeddings
          python -m build packages/multi-agent
      - name: Twine check
        run: python -m twine check dist/* packages/mineru/dist/* packages/embeddings/dist/* packages/multi-agent/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*
            packages/mineru/dist/*
            packages/embeddings/dist/*
            packages/multi-agent/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Consolidate wheels and sdists
        run: |
          mkdir -p upload
          find dist -name "*.whl" -exec mv {} upload/ \;
          find dist -name "*.tar.gz" -exec mv {} upload/ \;
      - name: Debug - check secret exists
        env:
          JUSKUE: ${{ secrets.JUSKUE }}
        run: |
          if [ -z "$JUSKUE" ]; then
            echo "ERROR: JUSKUE is NOT SET (empty or missing)"
            exit 1
          else
            echo "OK: JUSKUE is set (length: ${#JUSKUE})"
          fi
      - name: Publish to PyPI via twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.JUSKUE }}
        run: |
          python -m pip install twine
          twine upload --verbose upload/*
