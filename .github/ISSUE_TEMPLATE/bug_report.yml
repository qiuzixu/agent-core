name: 缺陷报告
description: 报告可以稳定复现的框架问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 安全漏洞请按 SECURITY.md 私密报告，不要在这里公开。
  - type: input
    id: version
    attributes:
      label: Agent Core 版本
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Python 3.13、Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 请提供已经去除密钥和业务数据的代码、配置和步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为和完整错误栈
    validations:
      required: true
