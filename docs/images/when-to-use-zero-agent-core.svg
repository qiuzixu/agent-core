  <text x="800" y="325" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#475569">LangGraph</text>
  <text x="800" y="350" text-anchor="middle" font-size="13" font-family="Microsoft YaHei, sans-serif" fill="#334155">Graph / State / 平台生态</text>

  <rect x="150" y="410" width="700" height="140" rx="20" fill="#f1f5f9" stroke="#94a3b8"/>
