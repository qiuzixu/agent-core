  <text x="200" y="185" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#0369a1">LangChain / LangGraph</text>
  <text x="200" y="210" text-anchor="middle" font-size="14" font-family="Microsoft YaHei, sans-serif" fill="#0369a1">CrewAI / AG2 / OpenAI Agents SDK</text>

  <rect x="370" y="120" width="260" height="110" rx="16" fill="#dcfce7" stroke="#22c55e"/>
