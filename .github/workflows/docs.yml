name: Docs

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]" mkdocs-material
      - name: Build docs
        run: python -m mkdocs build
      - uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site
